<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
  
    <title>Tshenolo's World clock</title>
</head>
<body>
   <div class="container">
    <h1>World Clock 🕰️</h1>
   <select id="city">
<option value="">Select a city..</option>
<option value="current">My current location</option>
<option value="Europe/London">London</option>
<option value="America/New_York">New York</option>
<option value="Pacific/Auckland">Auckland</option>
</select>

   <div id="cities">
<div class="city" id="los-angeles">
  <div>
        <h2>Los Angeles <small>🇺🇸</small></h2>
        <div class="date">August 15th 2022</div>
    </div>
        <div class="time">1:48:15 <small> AM</small></div>
      </div>
      <div class="city" id="sydney">
<div>
        <h2>Sydney <small>🇦🇺</small></h2>
        <div class="date">August 15th 2022</div>
</div>
        <div class="time">1:48:15 <small>AM</small></div>
      </div>
      </div>
      </div>
      



   
    <script src="script.js"></script>

    <footer>This project was coded by <strong>Tshenolo Molatlhegi</strong> and is open sourced on <a href="https://github.com/rtshenolo621-design/World-Clock/commit/be9b65cfa452da30be78457db15f84b89fe6e77c" target="_blank">GitHub</a>  hosted on <a href="https://app.netlify.com/projects/molatlhegi-worldclock/deploys" target="_blank">Netlify</a></footer>

</body>
</html>
